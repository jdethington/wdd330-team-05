<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>



      <section class="client-info">

        <form action="" method="post">
           <div class="checkout-form">
              <label for="fname">First Name</label>
              <input type="text" 
              name="fname" 
              id="fname"
              autocomplete="given-name"
              maxlength="50"
              required/>

           </div>

           <div class="checkout-form">

            <label for="lname">Last Name</label>
            <input type="text" 
                name="lname" 
                id="last-name"
                autocomplete="family-name"
                maxlength="50"
                required
                />
           </div>

           <div class="checkout-form">
              <label for="street-address">Street Address</label>
              <input type="text"
                name="street"
                id="street-address"
                autocomplete="address-level1"
                required
              />
           </div>

           <div class="checkout-form">
              <label for="city">City</label>

              <input type="text"
                  name="city"
                  id="city"
                  autocomplete="address-level2"
                  required
              />
           </div>

           <div class="checkout-form">
               <label for="state">State</label>
               <input type="text"
                     name="state"
                     id="state"
                     required
               
               />
              
           </div>

           <div class="chechout-form">
              <label for="zip">Zip Code</label>
              <input type="text"
                    name="zip"
                    id="zip"
                    inputmode="numeric"
                    pattern="[0-9]{5}(-[0-9]{4})?"
                    autocomplete="postal-code"
                    required
              />
           </div>

           <div class="checkout-form">
              <label for="credit-card">Credit Card Number</label>
               <input type="text" 
               name="cardNumber" 
               id="credit-card"
               inputmode="numeric"
               pattern="[0-9\s]{13,19}"
               autocomplete="cc-number"
               required/>


           </div>

           <div class="check-out">
              <label for="expiration-date">Expiration Date</label>
              <input type="text" 
                name="expiration" 
                id="expiration-date"
                placeholder="MM/YY"
                pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
                autocomplete="cc-exp"
                required/>
           </div>

           <div class="check-out">
              <label for="code">Security Code</label>
              <input type="text" 
               id="code"
               name="code"
               inputmode="numeric"
               pattern="[0-9]{3,4}"
               maxlength="4"
               autocomplete="cc-csc"
               required 
               />

             
           </div>

           <button type="submit">Checkout</button>

        </form>
        <fieldset class="Summary">
          <legend>Order Summary</legend>
          <p>Subtotal: <span id="subtotal"></span></p>
          <p>Tax : <span id="tax"></span></p>
          <p>Shipping Estimate: <span id="shipping"></span></p>
          <p>Order Total: <span id="total"></span></p>

        </fieldset>
            

        </div>



      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
