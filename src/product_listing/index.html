<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Listing</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/product_listing.js"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section id="product-list" class="products">
        <h2>Top Products: <span class="title highlight"></span></h2>
        <nav class="navbar">
          <form
            id="search-form"
            class="search-form"
            action="/product_listing/index.html"
            method="GET"
          >
            <input
              type="search"
              name="search"
              id="search-input"
              placeholder="Search products"
              aria-label="Search products"
              required
            />

            <button type="submit">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
          </form>
        </nav>
        <div class="sort-by">
          <h3>Sort by</h3>
          <label for="sort-select" class="hide">Sort by</label>
          <select name="sort" id="sort-select">
            <option value="name">Name (A-Z)</option>
            <option value="price">Price (Low to High)</option>
          </select>
        </div>

        <ul class="product-list"></ul>

        <div class="display-products">
          <a href="/product_listing/index.html?category=tents">
            <img
              src="/images/category-tents.svg"
              alt="Category tents"
              width="110"
            />
          </a>
          <a href="/product_listing/index.html?category=backpacks">
            <img
              src="/images/category-backpacks.svg"
              alt="Backpack"
              width="110"
            />
          </a>
          <a href="/product_listing/index.html?category=sleeping-bags">
            <img
              src="/images/category-sleepingbags.svg"
              alt="Sleeping bag"
              width="110"
            />
          </a>
          <a href="/product_listing/index.html?category=hammocks">
            <img
              src="/images/category-hammocks.svg"
              alt="Hammocks"
              width="100"
            />
          </a>
        </div>
      </section>
    </main>

    <dialog id="myModal">
      <div id="modalContent"></div>
      <button type="button" id="closeBtn">X</button>
    </dialog>

    <footer id="main-footer"></footer>
  </body>
</html>
